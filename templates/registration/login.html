{% extends 'base/base.html' %}



{% block title %} login {% endblock title %}


{% block content %}
    <div class="login_container">
        <h3 id="login_announcment"> صفحه ورود </h3>
        <div class="login_form_container">
            <form class='login_form' method="post">
                {% csrf_token %}
                {% for field in form %}
                    <div class="login_form_fields">
                        <label class="login_form_field_label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                        {{ field }}
                    </div>
                    <div class="login_form_fileds_errors">
                        {% if field.error %}
                            <div class="login_form_fileds_errors_allert">
                                {% for error in field.errors %}
                                    <p class="error">{{ error }}</p>
                                {% endfor %}
                            </div>
                        {% endif %}
                    </div>
                {% endfor %}

            </form>
        </div>
    </div>



{% endblock content %}
